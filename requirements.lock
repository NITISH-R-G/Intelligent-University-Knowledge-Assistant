# ==============================================================================
# requirements.lock - the exact, verified dependency set
#
# WHAT THIS IS
#
# pyproject.toml states ALLOWED RANGES ("fastapi>=0.115,<1.0"). That is the right
# thing for a library to declare and the wrong thing for an application to build,
# because a range resolves to a different set of packages every week. This file
# records what this project is actually developed and tested against: one exact,
# verified set of 47 distributions.
#
# It is the artefact referred to in pyproject.toml ("The lockfile
# (requirements.lock) pins exact versions for reproducible builds").
#
# HOW IT WAS PRODUCED
#
#     python -m pip freeze
#
# run against a virtualenv in which the entire quality-gate suite passes:
# 361 passed / 3 skipped, ruff clean, ruff format clean, mypy strict clean,
# architecture rules clean. Every version below was therefore observed working
# together, not resolved in the abstract. This file is a record of a verified
# environment, not a prediction of one.
#
# Recorded on: 2026-10-04
# Interpreter:  CPython 3.14.3
# Platform:    Windows, x86_64
#
# Verified against pyproject.toml: every declared dependency, including the `dev`
# extra, resolves to a pinned version here that satisfies its declared range. That
# consistency is checked, not assumed.
#
# Regenerating it is an intentional act, not a side effect:
#
#     python -m pip install -e ".[dev]"
#     python -m pytest            # the full suite must pass first
#     python -m pip freeze > requirements.lock
#
# If the suite does not pass, the environment is not verified and its versions do
# not belong in this file.
#
# WHAT IT GUARANTEES, AND WHAT IT DOES NOT
#
# GUARANTEES: the same package versions are used on every machine and in CI, so a
#   test failure cannot be a version difference in disguise.
#
# DOES NOT GUARANTEE: byte-for-byte artefact integrity. There are no hashes here,
#   so pip verifies nothing about the downloaded files. A supply-chain compromise
#   of an index or a release would not be detected by this file. Adding `--hash`
#   pins would close that gap, and is a reasonable hardening step once CI is
#   standing up and there is a real hash set to maintain against.
#
# DOES NOT CONTAIN: the project itself. `knowledge-assistant` is installed from
#   source with `pip install -e ".[dev]"`; it is not a third-party distribution and
#   does not belong in this file.
#
# COST: zero. Every entry below is a public package from PyPI. No private index, no
#   paid or metered registry, no credential-bearing URL. No model provider, no
#   hosted vector database, no paid observability backend is present or reachable
#   through this dependency set.
#
# NOTE ON transitive dependencies: the file pins the whole resolved graph, not just
# the direct dependencies in pyproject.toml. That is the point of a lock. Entries
# such as certifi, idna and typing_extensions are required by something above them
# and are listed because removing them would break the install.
#
# One note on SQLAlchemy: alembic/env.py and the migration modules import it directly,
# so it is a declared direct dependency in pyproject.toml and not merely something
# alembic drags in. It was undeclared until the Phase 1 dependency audit found it;
# see the commit that added it.
# ==============================================================================

