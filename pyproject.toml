[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-assistant"
version = "0.1.0"
description = "Intelligent University Knowledge Assistant - Phase 1 engineering foundation"
readme = "README.md"
# The floor is 3.12, not 3.11, and that is a correctness requirement rather than a
# preference: the code uses PEP 695 `type` alias statements (`application/ports.py`,
# `application/idempotency.py`), which are a 3.12 language feature. Declaring 3.11 here
# advertised a support level the code cannot actually parse.
requires-python = ">=3.12"
license = { text = "Proprietary" }  # OQ-001 / DECISION_LOCK D-001: licence decision pending

# Dependencies are grouped by ROLE, not by convenience. The lockfile (requirements.lock)
# pins exact versions for reproducible builds; this table states allowed ranges.
dependencies = [
  # --- interface layer ---
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  # --- configuration / validation ---
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  # --- data access ---
  "alembic>=1.13,<2.0",
  # SQLAlchemy is imported directly by alembic/env.py and the migration modules, so it
  # is a direct dependency and not merely something alembic happens to pull in. It was
  # undeclared until the dependency audit in Phase 1; relying on a transitive edge means
  # an alembic upgrade that drops or reshapes its SQLAlchemy constraint breaks the
  # migration path with no declared change on our side.
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  # --- observability ---
  "structlog>=24.4",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-prometheus>=0.46b0",
]

[project.optional-dependencies]
# NOTE: k6 is NOT a Python package. It is executed as a binary in CI/dev images.
# See docs/12-performance/BENCHMARK_PROTOCOL.md. Deliberately not a dependency here.
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
ka = "knowledge_assistant.interfaces.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# ruff - formatting + lint. Chosen as the single lint/format tool (replaces
# flake8+black+isort). Config rationale: docs/03-architecture/DEPENDENCY_RULES.md
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
# Must match `requires-python`. See the note there.
target-version = "py312"
src = ["src", "tests", "scripts", "benchmarks"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # bugbear
  "A",           # shadowing builtins
  "C4",          # comprehensions
  "DTZ",         # naive datetimes - we require tz-aware everywhere
  "T20",         # no print()
  "ARG",         # unused arguments
  "PTH",         # pathlib
  "RET",         # return consistency
  "SIM",         # simplify
  "TID",         # tidy imports (used for architecture rules)
  "PL",          # pylint subset
  "S",           # bandit security
  "ANN",         # type annotations
  "D",           # pydocstyle
]
ignore = [
  "D203",   # incompatible with D211
  "D213",   # incompatible with D212
  "ANN401", # allow Any in explicitly-typed boundary adapters (documented)
  "S101",   # assert is allowed in tests; ruff applies S101 off for tests below
  "PLR0913",# too many arguments - use cases legitimately take several collaborators
]

[tool.ruff.lint.per-file-ignores]
# Tests. Every entry is a convention difference, not a defect tolerance:
#  - S101 assert, S105/S106: tests assert on credentials and host strings by design.
#  - ANN001/ANN201: pytest injects fixtures; annotating them adds noise, not safety.
#  - D100/D103: module and function docstrings; the module docstring states the intent and
#    every test name is a full sentence naming the guarantee it defends.
#  - D102: same reason for test methods - `test_a_duplicate_submission_runs_the_operation_once`
#    is already the specification, and a second restatement of it is noise.
#  - D205: test docstrings carry a single-sentence rationale that frequently wraps past the
#    100-column limit. Splitting it into summary+blank+description would break the sentence
#    in half for no reader benefit.
#  - TID252: shared test doubles live in tests/conftest.py and are imported relatively.
#  - S104: several tests assert that binding all interfaces is REFUSED in production.
#  - PLR2004: status codes and thresholds are clearer inline than behind named constants.
"tests/**" = [
  "S101", "S104", "S105", "S106",
  "ANN001", "ANN201",
  "D100", "D102", "D103", "D205",
  "TID252", "PLR2004",
]
"benchmarks/**" = ["S101", "T201"]
# The benchmark framework shells out to `git` to record the commit SHA and dirty flag that
# every result carries. S603/S607 flag a command taken from a variable or resolved through
# PATH; here the argument list is a literal and the only variable is the resolved working
# directory, so neither finding applies. This mirrors the identical exemption scripts/ has.
"benchmarks/framework/environment.py" = ["S603", "S607"]
"scripts/**" = ["S603", "S607", "T201", "ANN"]
# The test doubles implement the same Protocols as the production adapters, so they must
# accept every parameter the port declares - `result`, `now`, `*args`, `**kwargs` - even
# where the double does not need to read them. Dropping or renaming them would break
# structural conformance to the port, which is the whole point of using real ports here.
"tests/conftest.py" = ["ARG002"]
# The `ka` developer's CLI exists to write to the developer's terminal. T201 bans print() so
# that library code never bypasses the structured logger; a CLI is the one place where
# human-readable stdout is the correct output.
"src/knowledge_assistant/interfaces/cli.py" = ["T201"]
# The knowledge demo commands write to the developer's terminal for the same reason:
# a demo is read by a person, and routing it through structured logs would make it
# unreadable. Same exemption, same justification, same scope - this one entry point.
"src/knowledge_assistant/knowledge_main.py" = ["T201"]
# Database adapters. S608 fires on f-strings containing SQL, but it cannot tell a
# module-level column-list constant from user input. Every query in this package binds its
# values through psycopg's named placeholders (`%(name)s`); the only interpolated values are
# `_JOB_COLUMNS` / `_COLUMNS`, which are literals defined in the same module. The invariant
# is asserted by tests/architecture/test_dependency_rules.py.
"src/knowledge_assistant/infrastructure/db/*.py" = ["S608"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"   # no `from ..x import y` anywhere

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy - static typing is a CI gate. Strict on domain + application (where the
# logic lives); relaxed only at infrastructure edges where third-party stubs
# are unavailable.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"   # must match `requires-python`; see pyproject `[project]`
# The project uses a src/ layout, so the package root is `src`, not the repository root.
# Without this, every `knowledge_assistant.*` import is unresolvable and mypy reports
# import-not-found for the entire codebase.
mypy_path = "src"
# Required alongside `mypy_path` for a src/ layout: it makes mypy derive module names from
# the search path rather than by walking up for `__init__.py`. Without it the same file
# resolves as both `application.ports` and `knowledge_assistant.application.ports`, and
# mypy aborts before type-checking anything.
explicit_package_bases = true
# `benchmarks` is included: the framework is shipped code with no test-suite coverage of its
# own contracts beyond tests/unit/test_benchmark_framework.py, so it must be type-checked
# like everything else. It was a forward reference while the directory did not exist, and
# mypy treats an unresolvable path as a hard error rather than skipping it.
files = ["src", "scripts", "benchmarks"]
strict = true
warn_unreachable = true
show_error_codes = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["structlog.*", "opentelemetry.*", "uvicorn.*"]
ignore_missing_imports = true
follow_imports = "skip"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
]
markers = [
  "unit: pure domain/application logic, no I/O",
  "contract: interface contract assertions (API shape, error mapping)",
  "integration: requires a live PostgreSQL; skipped when TEST_DATABASE_URL is unset",
  "architecture: static dependency-rule enforcement over the source tree",
  "failure_injection: deliberately induces a failure and asserts the documented behaviour",
  "property: hypothesis property-based tests",
  "slow: excluded from the fast lane",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]   # any warning becomes a failure; see docs/11-testing/TEST_STRATEGY.md